name: multai_mobile
description: "a platform for image retrieval"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  shared_preferences: ^2.5.4
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  internet_connection_checker_plus: ^2.9.1+2
  http: ^1.6.0
  connectivity_plus: ^7.0.0
  google_fonts: ^8.0.2
  flutter_dotenv: ^6.0.0
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

