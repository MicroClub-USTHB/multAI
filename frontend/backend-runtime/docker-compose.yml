services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multi_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    container_name: multi_nats
    command: >
      -js
      -a 0.0.0.0
      -m ${NATS_MONITOR_PORT}
      --user ${NATS_USER}
      --pass ${NATS_PASSWORD}
    ports:
      - "${NATS_PORT}:4222"
      - "${NATS_MONITOR_PORT}:8222"

  minio:
    image: minio/minio:latest
    container_name: multi_minio
    restart: unless-stopped
    env_file:
      - .env
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: multi_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  fastapi:
    image: ${BACKEND_IMAGE:-ghcr.io/microclub-usthb/multai-back:latest}
    container_name: multi_fastapi
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - nats
      - minio
    ports:
      - "8000:8000"

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/microclub-usthb/multai-back:latest}
    container_name: multi_migrate
    env_file:
      - .env
    depends_on:
      - postgres
    command: ["uv", "run", "alembic", "upgrade", "heads"]

volumes:
  postgres_data:
  minio_data:
  redis_data:

