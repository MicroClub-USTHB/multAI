name: CD

# main    -> build + push image (latest, sha-<sha>) -> deploy to the VPS
# develop -> build + push image (develop, sha-<sha>), no deploy
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: multai-front-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/microclub-usthb/multai-front

jobs:
  build:
    name: Build and push image (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then tags="${tags},${IMAGE}:latest"; fi
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then tags="${tags},${IMAGE}:develop"; fi
          echo "list=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}
            VITE_APP_TITLE=${{ vars.VITE_APP_TITLE || 'MultAI' }}
            VITE_SITE_URL=${{ vars.MULTAI_PUBLIC_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy web to the VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: multai-deploy-web
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set; trusting the host key on first contact"
            ssh-keyscan -T 10 "$VPS_HOST" > ~/.ssh/known_hosts
          fi

      - name: Deploy web ${{ needs.build.outputs.tag }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token lets the server pull a private image for this run; it is sent on stdin, never in argv.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null && cd /opt/multai && ./deploy.sh web '$TAG'"
