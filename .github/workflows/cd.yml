name: CD

# Builds the backend and web images (linux/amd64) on every push to main/develop and
# pushes them to GHCR. Nothing deploys from here: Watchtower on the VPS pulls the new
# image of each running container and recreates it (see deploy/README.md).
# One commit builds BOTH images, so sha-<commit> exists for the backend and the web.
#
# Tags: sha-<commit> always, plus `latest` (main) or the branch name (develop, ...).
#
# The image names are fixed on purpose (not derived from the repository name), so
# renaming this repository does not move the images or break the server:
#   ghcr.io/microclub-usthb/multai-back   (backend/)
#   ghcr.io/microclub-usthb/multai-front  (frontend/)
#
# Repository variables for the web build (all optional): VITE_API_BASE_URL (default /api),
# VITE_APP_TITLE (default MultAI), MULTAI_PUBLIC_URL.
#
# The two GHCR packages (multai-back, multai-front) must allow this repository to
# write: Package settings > Manage Actions access > add this repository (Write).

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing to push (for example a missing package permission) must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: backend
            image: ghcr.io/microclub-usthb/multai-back
          - app: frontend
            context: frontend
            image: ghcr.io/microclub-usthb/multai-front
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          branch_tag="${GITHUB_REF_NAME//\//-}"
          [ "$GITHUB_REF_NAME" = "main" ] && branch_tag="latest"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "${IMAGE}:${branch_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ matrix.app == 'frontend' && format('VITE_API_BASE_URL={0}', vars.VITE_API_BASE_URL || '/api') || '' }}
            ${{ matrix.app == 'frontend' && format('VITE_APP_TITLE={0}', vars.VITE_APP_TITLE || 'MultAI') || '' }}
            ${{ matrix.app == 'frontend' && format('VITE_SITE_URL={0}', vars.MULTAI_PUBLIC_URL) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
